# Render Blueprint for the asset register API.
#
# The compile is driven by the `postinstall` script in package.json, so it runs
# whatever build command is configured — including Render's dashboard default of
# plain `npm install`. That matters because a manually created service ignores
# this file entirely.
#
# --include=dev is kept explicit here: TypeScript and every @types/* package are
# devDependencies, and `tsc` cannot compile without them.
#
# `dist/` is gitignored, so the compiled output only exists if the build runs.
services:
  - type: web
    name: assets-tracker-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Render injects PORT itself; the app reads it.
      # Deliberately NOT setting NODE_ENV=production: that makes npm skip
      # devDependencies, which would leave postinstall without a compiler.
      - key: NODE_VERSION
        value: "22"

      # Point this at the deployed frontend, or the browser will be blocked by
      # CORS and the session cookie will not be sent.
      - key: CLIENT_ORIGIN
        sync: false

      # --- set these in the Render dashboard, never in the repo ---
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: DYNAMODB_TABLE
        sync: false
      - key: CLOUD_NAME
        sync: false
      - key: CLOUD_API_KEY
        sync: false
      - key: CLOUD_API_SECRET
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
